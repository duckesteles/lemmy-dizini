name: Topluluk ekle
description: Dizine Türkçe bir Lemmy topluluğu ekle.
title: "Topluluk: "
labels: ["topluluk-ekle"]
body:
  - type: markdown
    attributes:
      value: |
        Topluluğunu dizine eklemek için bu formu doldur.
  - type: input
    id: handle
    attributes:
      label: Topluluk adresi
      description: "`isim@instance` biçiminde yaz."
      placeholder: isim@instance.tld
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Görünen isim
      description: Boş bırakırsan topluluğun Lemmy'deki kendi adı kullanılır.
      placeholder: Topluluk adı
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Açıklama
      description: Topluluğu bir iki cümleyle anlat (opsiyonel).
      placeholder: Topluluğun kısa açıklaması
    validations:
      required: false
  - type: checkboxes
    id: onay
    attributes:
      label: Onay
      options:
        - label: Bu topluluk Türkçe (ya da Türkiye ile ilgili) ve gerçekten var.
          required: true
