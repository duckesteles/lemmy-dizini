name: Validate

on:
  pull_request:
    paths:
      - "communities/**"
      - "src/**"
      - "build.js"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the site
        run: node build.js
