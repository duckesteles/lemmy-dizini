name: Add community

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: add-community
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'onaylandı'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Parse issue form into a community file
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/issue-to-community.mjs

      - name: Validate build
        run: node build.js

      - name: Commit to main
        env:
          SLUG: ${{ steps.parse.outputs.slug }}
          HANDLE: ${{ steps.parse.outputs.handle }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "communities/${SLUG}.json"
          if git diff --cached --quiet; then
            echo "Zaten mevcut, değişiklik yok."
          else
            git commit -m "feat(community): add ${HANDLE}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Comment and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          HANDLE: ${{ steps.parse.outputs.handle }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "\`${HANDLE}\` dizine eklendi. Teşekkürler!"
          gh issue close "$ISSUE_NUMBER" --reason completed || true

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Otomatik ekleme başarısız oldu. **Topluluk adresi** alanının \`isim@instance.tld\` biçiminde olduğundan emin ol."
