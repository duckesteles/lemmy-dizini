<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lemmy Türkçe Topluluk Dizini</title>
  <meta name="description" content="Türkçe Lemmy topluluklarının sade, açık kaynaklı dizini.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/assets/lemmy.png" alt="" width="36" height="24"> lemmy dizini</a>
      <nav>
        <a href="{{REPO}}#adding-a-community">Ekle</a>
        <a href="{{REPO}}" rel="noopener">GitHub</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Aydınlık / karanlık tema">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="hero">
      <h1>Türkçe Lemmy toplulukları</h1>
      <p class="intro">Dağınık Türkçe Lemmy toplulukları için tek bir dizin.</p>
    </div>

    <input id="search" type="search" placeholder="Topluluk ara…" autocomplete="off" aria-label="Topluluk ara">

    <ul id="list" class="grid">
      {{CARDS}}
    </ul>
    <p id="empty" class="empty" hidden>Eşleşen topluluk yok.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>AGPLv3 Lisanslı</span>
    </div>
  </footer>

  <script src="/assets/theme.js" defer></script>
  <script src="/assets/home.js" defer></script>
</body>
</html>
