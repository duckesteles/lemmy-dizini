<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}} · Lemmy Dizini</title>
  <meta name="description" content="{{DESCRIPTION_META}}">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://{{INSTANCE}}" crossorigin>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/assets/lemmy.png" alt="" width="36" height="24"> lemmy dizini</a>
      <nav>
        <a href="{{REPO}}#topluluk-ekleme">Ekle</a>
        <a href="{{REPO}}" rel="noopener">GitHub</a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Aydınlık / karanlık tema">
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap community"
        data-api="{{API_URL}}"
        data-community-url="{{COMMUNITY_URL}}"
        data-copy-handle="{{COPY_HANDLE}}"
        data-name="{{NAME}}"
        data-instance="{{INSTANCE}}"
        data-initial="{{INITIAL}}">

    <a class="back" href="/">← Tüm topluluklar</a>

    <div class="card panel">
      <div class="c-banner" id="c-banner" hidden aria-hidden="true">
        <span class="c-banner-lqip" id="c-banner-lqip"></span>
        <span class="c-banner-real" id="c-banner-real"></span>
      </div>

      <div class="c-head">
        <span class="c-icon" id="c-icon" data-initial="{{INITIAL}}">{{INITIAL}}</span>
        <div class="c-head-text">
          <h1 id="c-name">{{NAME}}</h1>
          <p class="c-handle" id="c-handle">{{COPY_HANDLE}}</p>
          <p class="c-stats" id="c-stats" hidden>
            <span id="stat-subs">–</span> abone · <span id="stat-posts">–</span> gönderi
          </p>
        </div>
      </div>

      <p class="c-desc" id="c-desc">{{DESCRIPTION}}</p>

      <div class="c-actions">
        <a class="btn btn-primary" id="btn-visit" href="{{COMMUNITY_URL}}" rel="noopener">Topluluğa git →</a>
        <button class="btn btn-secondary" id="btn-copy" type="button" data-copy="{{COPY_HANDLE}}">Adresi kopyala</button>
      </div>
      <p class="c-hint">Adresi kopyalayıp kendi instance'ının arama kutusuna yapıştırarak da katılabilirsin.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>AGPLv3 Lisanslı</span>
    </div>
  </footer>

  <script src="/assets/theme.js" defer></script>
  <script src="/assets/community.js" defer></script>
</body>
</html>
